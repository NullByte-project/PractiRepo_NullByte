<div class="admin-notifications-container">
  <!-- Filtros y header -->
  <div class="header">
    <h1>Solicitudes de Documentos</h1>
    <div class="filters">
      <select [(ngModel)]="selectedStatus" (change)="onStatusFilterChange()">
        <option *ngFor="let option of statusOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>
  </div>

  <!-- Listado de solicitudes -->
  <div class="requests-list">
    <div *ngFor="let request of filteredRequests" class="request-card">
      <div class="request-header">
        <span class="practice-title">{{ request._id }}</span>
        <span class="practice-title">{{ request.practice_title }}</span>
        <span class="practice-title">{{ request.requester_name }}</span>
        <span class="practice-title">{{ request.requester_email }}</span>
        <span class="practice-title">{{ request.request_date }}</span>

        <span class="status-badge" [ngClass]="request.status">
          {{ request.status | titlecase }}
        </span>
      </div>

      <!-- Detalles de la solicitud -->
      <div class="request-details">
        <!-- ... otros detalles ... -->
      </div>

      <!-- Acciones -->
      <div class="request-actions" *ngIf="request.status === DocumentRequestStatus.PENDING">
        <button class="btn-approve" (click)="updateRequestStatus(request, DocumentRequestStatus.APPROVED)">
          <i class="fas fa-check"></i> Aprobar
        </button>

        <div class="reject-section" *ngIf="selectedRequest?.id === request._id; else showRejectButton">
          <textarea [(ngModel)]="adminNotes" 
                    placeholder="Motivo del rechazo (opcional)"
                    maxlength="500"></textarea>
          <div class="reject-buttons">
            <button class="btn-confirm-reject" 
                    (click)="updateRequestStatus(request, DocumentRequestStatus.REJECTED)">
              Confirmar Rechazo
            </button>
            <button class="btn-cancel" (click)="cancelReject()">
              Cancelar
            </button>
          </div>
        </div>

        <ng-template #showRejectButton>
          <button class="btn-reject" (click)="prepareReject(request)">
            <i class="fas fa-times"></i> Rechazar
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</div>
