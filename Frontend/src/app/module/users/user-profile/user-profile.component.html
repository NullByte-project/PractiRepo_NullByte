<div class="profile-container">
  <h2>Mi Perfil</h2>

  <div *ngIf="isLoading">Cargando...</div>
  <div *ngIf="message" class="message">{{ message }}</div>

  <div *ngIf="!isLoading">
    <!-- Información del usuario -->
    <div class="profile-section">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" [(ngModel)]="user.name" [disabled]="!editMode">
      </div>

      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="user.email" disabled>
      </div>

      <div class="button-group">
        <button *ngIf="!editMode" class="btn-edit" (click)="toggleEdit()">✏️ Editar</button>
        <button *ngIf="editMode" class="btn-save" (click)="updateProfile()">💾 Guardar</button>
        <button *ngIf="editMode" class="btn-cancel" (click)="toggleEdit()">❌ Cancelar</button>
      </div>
    </div>

    <!-- Cambio de contraseña -->
    <div class="password-section">
      <h3>Cambiar Contraseña</h3>

      <div class="form-group">
        <label>Contraseña actual:</label>
        <input type="password" [(ngModel)]="passwordData.current">
      </div>

      <div class="form-group">
        <label>Nueva contraseña:</label>
        <input type="password" [(ngModel)]="passwordData.new">
      </div>

      <div class="form-group">
        <label>Confirmar contraseña:</label>
        <input type="password" [(ngModel)]="passwordData.confirm">
      </div>

      <button class="btn-save" (click)="changePassword()">🔑 Cambiar Contraseña</button>
    </div>
  </div>
</div>
