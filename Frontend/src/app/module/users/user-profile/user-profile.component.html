<div class="profile-container">
  <h2>Perfil de Usuario</h2>
  <div class="profile-field">
    <label for="first-name">Nombres:</label>
    <input id="first-name" type="text" value="Juan" readonly />
    <button class="edit-btn" onclick="enableEdit('first-name')">
      ✏️
    </button>
  </div>
  <div class="profile-field">
    <label for="last-name">Apellidos:</label>
    <input id="last-name" type="text" value="Pérez" readonly />
    <button class="edit-btn" onclick="enableEdit('last-name')">
      ✏️
    </button>
  </div>
  <div class="profile-field">
    <label for="email">Correo:</label>
    <input id="email" type="email" value="juan.perez@example.com" readonly />
    <button class="edit-btn" onclick="enableEdit('email')">
      ✏️
    </button>
  </div>
</div>
