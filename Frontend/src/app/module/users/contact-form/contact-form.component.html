<div class="container">
  <h1>Formulario de contacto</h1>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="nombre">Nombre completo <span class="required">*</span></label>
        <div class="name-group">
          <input id="nombre" type="text" placeholder="Nombre" formControlName="nombre">
          <input id="apellidos" type="text" placeholder="Apellidos" formControlName="apellidos">
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input id="email" type="email" formControlName="email">
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <div class="phone-input">
          <div class="country-code">
            <div class="flag">🇨🇴</div>
            <span class="code">+</span>
          </div>
          <input id="telefono" type="tel" placeholder="321 1234567" formControlName="telefono">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="mensaje">Comentario o mensaje</label>
      <textarea id="mensaje" rows="6" formControlName="mensaje"></textarea>
    </div>

    <div class="form-group">
      <label for="tipoUsuario">Tipo de usuario <span class="required">*</span></label>
      <select id="tipoUsuario" formControlName="tipoUsuario">
        <option value="" disabled selected>Seleccione una opción</option>
        <option value="estudiante">Estudiante</option>
        <option value="egresado">Egresado</option>
        <option value="personaNatural">Persona natural</option>
      </select>
    </div>

    <div class="form-group terms">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="terminos">
        Acepto los Términos y condiciones <span class="required">*</span>
      </label>
    </div>

    <button type="submit" [disabled]="!contactForm.valid">Enviar</button>
    
    <div *ngIf="success" class="success-message">{{ success }}</div>
    <div *ngIf="error" class="error-message">{{ error }}</div>
  </form>
</div>
