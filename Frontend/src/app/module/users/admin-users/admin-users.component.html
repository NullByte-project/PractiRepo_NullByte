<div class="admin-users-container">
  <h2>Administrar Usuarios</h2>

  <div *ngIf="isLoading" class="loading">Cargando usuarios...</div>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

  <table *ngIf="!isLoading && users.length">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td data-label="Nombre">{{ user.name }}</td>
        <td data-label="Email">{{ user.email }}</td>
        <td data-label="Rol">{{ user.role_id?.name || user.role_id }}</td>
        <td data-label="Acciones" class="actions">
        <button class="btn-edit" (click)="startEdit(user)">✏️ Editar</button>
        <button class="btn-delete" (click)="confirmDelete(user)">🗑️ Eliminar</button>
  </td>
</tr>

    </tbody>
  </table>

  <div *ngIf="selectedUser" class="edit-modal">
    <h3>Editar Usuario</h3>
    
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="editData.name" name="name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="editData.email" name="email" disabled>
    </div>

    <div class="form-group">
      <label>Rol</label>
      <select [(ngModel)]="editData.role_id" name="role_id">
        <option *ngFor="let role of roles" [value]="role._id">
          {{ role.name }}
        </option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-save" (click)="updateUser()">💾 Guardar</button>
      <button class="btn-cancel" (click)="cancelEdit()">❌ Cancelar</button>
    </div>
  </div>
</div>
