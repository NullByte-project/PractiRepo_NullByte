<div class="password-container">
  <h2>Cambiar Contraseña</h2>
  
  <form [formGroup]="changeForm" (ngSubmit)="onSubmit()" class="password-form">
    <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>

    <div class="form-group">
      <label>Contraseña Actual</label>
      <input type="password" formControlName="currentPassword">
      <div class="error-text" *ngIf="changeForm.get('currentPassword')?.invalid && changeForm.get('currentPassword')?.touched">
        Campo requerido
      </div>
    </div>

    <div class="form-group">
      <label>Nueva Contraseña</label>
      <input type="password" formControlName="newPassword">
      <div class="error-text" *ngIf="changeForm.get('newPassword')?.invalid && changeForm.get('newPassword')?.touched">
        Mínimo 8 caracteres
      </div>
    </div>

    <div class="form-group">
      <label>Confirmar Nueva Contraseña</label>
      <input type="password" formControlName="confirmPassword">
      <div class="error-text" *ngIf="changeForm.get('confirmPassword')?.errors?.['mismatch']">
        Las contraseñas no coinciden
      </div>
    </div>

    <button type="submit" [disabled]="isLoading || changeForm.invalid" class="btn-submit">
      {{ isLoading ? 'Procesando...' : 'Cambiar Contraseña' }}
    </button>
  </form>
</div>
