<div class="password-container">
  <h2>Recuperar Contraseña</h2>
  
  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="password-form">
    <div *ngIf="message" class="alert info">{{ message }}</div>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" formControlName="email" placeholder="ejemplo@correo.com">
      <div class="error-text" *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">
        Ingrese un correo válido
      </div>
    </div>

    <button type="submit" [disabled]="isLoading || resetForm.invalid" class="btn-submit">
      {{ isLoading ? 'Enviando...' : 'Enviar Instrucciones' }}
    </button>
  </form>
</div>
